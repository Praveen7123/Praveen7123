<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="sx-t">
  <title id="sx-t">SENTIMENT-X: recognizes emotion across video, audio and text.</title>
  <defs>
    <linearGradient id="sx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="sx-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sx-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="sx-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sx-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="sx-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sx-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sx-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sx-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sx-in { animation: sx-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .sx-d1 { animation-delay: .15s; } .sx-d2 { animation-delay: .4s; }
    .sx-chip { animation: sx-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes sx-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .sx-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: sx-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes sx-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sx-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .sx-in, .sx-chip { animation: none; } .sx-draw { animation: none; stroke-dashoffset: 0; } }
    .sx-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: sx-trace 7s linear infinite; }
    @keyframes sx-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .sx-trace { display: none; } }
  </style>
  <g clip-path="url(#sx-clip)">
    <rect width="1200" height="370" fill="url(#sx-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#sx-grid)"/>
    <rect width="1200" height="370" fill="url(#sx-glow)"/>
    <g class="sx-in sx-d1">
      <text class="sx-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 · MULTIMODAL AI · DEEP LEARNING · 2024</text>
      <text class="sx-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">SENTIMENT-X<tspan class="sx-serif" font-size="22" font-style="italic" fill="#E5B5C7" dx="14">multimodal emotion AI</tspan></text>
      <text class="sx-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Recognizes emotion across video, audio and text, in real time.</text>
      <text class="sx-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> CNN for faces · CNN–Transformer for speech · fine-tuned DistilBERT</text>
      <line class="sx-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="sx-serif" font-size="34" font-weight="300" fill="#F8F0F3">92%</text><text class="sx-sans" y="24" font-size="12.5" fill="#B6A3AC">accuracy</text></g>
    <g transform="translate(261 266)"><text class="sx-serif" font-size="34" font-weight="300" fill="#F8F0F3">60%</text><text class="sx-sans" y="24" font-size="12.5" fill="#B6A3AC">latency reduction</text></g>
    <g transform="translate(466 266)"><text class="sx-serif" font-size="34" font-weight="300" fill="#F8F0F3">3</text><text class="sx-sans" y="24" font-size="12.5" fill="#B6A3AC">modalities · video, audio, text</text></g>
      <g class="sx-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="69" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sx-mono" x="90" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PyTorch</text></g><g class="sx-chip" style="animation-delay:1.12s"><rect x="133" y="314" width="39" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sx-mono" x="152" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">CNN</text></g><g class="sx-chip" style="animation-delay:1.24s"><rect x="180" y="314" width="106" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sx-mono" x="233" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Transformers</text></g><g class="sx-chip" style="animation-delay:1.36s"><rect x="294" y="314" width="91" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sx-mono" x="340" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">DistilBERT</text></g><g class="sx-chip" style="animation-delay:1.48s"><rect x="393" y="314" width="61" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sx-mono" x="424" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">OpenCV</text></g>
    </g>
    <g class="sx-in sx-d2"><g transform="translate(0 35)">
      <g>
        <rect x="760" y="50" width="250" height="38" rx="12" fill="#F8F0F3" fill-opacity=".07" stroke="#C77B9B" stroke-opacity=".3"/>
        <text class="sx-mono" x="776" y="74" font-size="12" fill="#F8F0F3">“how does this clip feel?”</text>
        <g transform="translate(760 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
          </rect>
          <text class="sx-mono" x="8" y="18" font-size="9" fill="#B6A3AC">01</text>
          <text class="sx-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Video</text>
        </g>
        <g transform="translate(844 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
          </rect>
          <text class="sx-mono" x="8" y="18" font-size="9" fill="#B6A3AC">02</text>
          <text class="sx-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Audio</text>
        </g>
        <g transform="translate(928 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
          </rect>
          <text class="sx-mono" x="8" y="18" font-size="9" fill="#B6A3AC">03</text>
          <text class="sx-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Text</text>
        </g>
        <g transform="translate(1012 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
          </rect>
          <text class="sx-mono" x="8" y="18" font-size="9" fill="#B6A3AC">04</text>
          <text class="sx-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Fuse</text>
        </g>
        <g transform="translate(1096 112)">
          <rect width="76" height="58" rx="9" fill="#27101C" stroke="#C77B9B" stroke-opacity=".3">
            <animate attributeName="fill" values="#27101C;#701A3D;#27101C;#27101C" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
          </rect>
          <text class="sx-mono" x="8" y="18" font-size="9" fill="#B6A3AC">05</text>
          <text class="sx-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#F8F0F3">Emotion</text>
        </g>
        <text class="sx-mono" x="1176" y="214" font-size="12" text-anchor="end" fill="#E5B5C7">face · voice · words → one emotion</text>
        <text class="sx-mono" x="1176" y="240" font-size="10.5" text-anchor="end" letter-spacing="1.5" fill="#B6A3AC">CNN · CNN–TRANSFORMER · DISTILBERT</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="sx-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#sx-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
