    <rect width="208" height="150" rx="14" fill="none" stroke="url(#ws-edge)" stroke-width="1.2" class="ws-edge" style="animation-delay:2.35s"/>
    <text class="ws-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#6AA6FF">CPU</text>
    <circle cx="181" cy="31" r="3.5" fill="#6AA6FF"/>
    <line x1="22" y1="54" x2="186" y2="54" stroke="#6AA6FF" stroke-opacity=".15"/>
