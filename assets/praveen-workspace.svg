  </g></g>
  <g class="ws-tile" style="animation-delay:0.44s"><g transform="translate(496 40)">
    <rect width="208" height="150" rx="14" fill="#0A1120" stroke="#6AA6FF" stroke-opacity=".24"/>
    <rect width="208" height="150" rx="14" fill="none" stroke="url(#ws-edge)" stroke-width="1.2" class="ws-edge" style="animation-delay:2.70s"/>
    <text class="ws-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#6AA6FF">GPU</text>
    <circle cx="181" cy="31" r="3.5" fill="#6AA6FF"/>
    <line x1="22" y1="54" x2="186" y2="54" stroke="#6AA6FF" stroke-opacity=".15"/>
    <text class="ws-serif" x="22" y="92" font-size="26" fill="#EEF4FF">RTX 3050</text><text class="ws-sans" x="22" y="120" font-size="14" fill="#BCD8FF">NVIDIA</text>
  </g></g>
  <g class="ws-tile" style="animation-delay:0.56s"><g transform="translate(724 40)">
    <rect width="208" height="150" rx="14" fill="#0A1120" stroke="#6AA6FF" stroke-opacity=".24"/>
    <rect width="208" height="150" rx="14" fill="none" stroke="url(#ws-edge)" stroke-width="1.2" class="ws-edge" style="animation-delay:3.05s"/>
    <text class="ws-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#6AA6FF">MEMORY</text>
    <circle cx="181" cy="31" r="3.5" fill="#6AA6FF"/>
    <line x1="22" y1="54" x2="186" y2="54" stroke="#6AA6FF" stroke-opacity=".15"/>
    <text class="ws-serif" x="22" y="92" font-size="26" fill="#EEF4FF">16 GB</text><text class="ws-sans" x="22" y="120" font-size="14" fill="#BCD8FF">DDR4</text>
  </g></g>
  <g class="ws-tile" style="animation-delay:0.68s"><g transform="translate(952 40)">
    <rect width="208" height="150" rx="14" fill="#0A1120" stroke="#6AA6FF" stroke-opacity=".24"/>
    <rect width="208" height="150" rx="14" fill="none" stroke="url(#ws-edge)" stroke-width="1.2" class="ws-edge" style="animation-delay:3.40s"/>
    <text class="ws-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#6AA6FF">STORAGE</text>
    <circle cx="181" cy="31" r="3.5" fill="#6AA6FF"/>
    <line x1="22" y1="54" x2="186" y2="54" stroke="#6AA6FF" stroke-opacity=".15"/>
    <text class="ws-serif" x="22" y="92" font-size="26" fill="#EEF4FF">512 GB</text><text class="ws-sans" x="22" y="120" font-size="14" fill="#BCD8FF">SSD</text>
  </g></g>
