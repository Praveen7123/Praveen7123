<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="lm-t">
  <title id="lm-t">Learning Management System: full-stack online learning platform.</title>
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <radialGradient id="lm-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".7"/><stop offset="1" stop-color="#163A7A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lm-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6AA6FF" stroke-opacity=".07"/>
    </pattern>
    <filter id="lm-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lm-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="lm-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4FF"/><stop offset=".45" stop-color="#BCD8FF"/><stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .lm-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .lm-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lm-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lm-in { animation: lm-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .lm-d1 { animation-delay: .15s; } .lm-d2 { animation-delay: .4s; }
    .lm-chip { animation: lm-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes lm-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .lm-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: lm-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes lm-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes lm-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .lm-in, .lm-chip { animation: none; } .lm-draw { animation: none; stroke-dashoffset: 0; } }
    .lm-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: lm-trace 7s linear infinite; }
    @keyframes lm-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .lm-trace { display: none; } }
  </style>
  <g clip-path="url(#lm-clip)">
    <rect width="1200" height="370" fill="url(#lm-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#lm-grid)"/>
    <rect width="1200" height="370" fill="url(#lm-glow)"/>
    <g class="lm-in lm-d1">
      <text class="lm-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#6AA6FF">03 · FULL-STACK · ONLINE LEARNING</text>
      <text class="lm-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EEF4FF">Learning Platform<tspan class="lm-serif" font-size="22" font-style="italic" fill="#BCD8FF" dx="14">LMS</tspan></text>
      <text class="lm-sans" x="56" y="166" font-size="17" fill="#A5B1C4">A full-stack online learning platform on React, Firebase and Cloudflare.</text>
      <text class="lm-mono" x="56" y="200" font-size="12.5" fill="#BCD8FF"><tspan fill="#6AA6FF">BUILT ›</tspan> Firebase Auth + Firestore, Cloudflare Workers and R2 for course content</text>
      <line class="lm-draw" x1="56" y1="226" x2="680" y2="226" stroke="#6AA6FF" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="lm-serif" font-size="34" font-weight="300" fill="#EEF4FF">React</text><text class="lm-sans" y="24" font-size="12.5" fill="#A5B1C4">TypeScript front end</text></g>
    <g transform="translate(261 266)"><text class="lm-serif" font-size="34" font-weight="300" fill="#EEF4FF">Firebase</text><text class="lm-sans" y="24" font-size="12.5" fill="#A5B1C4">auth + Firestore</text></g>
    <g transform="translate(466 266)"><text class="lm-serif" font-size="34" font-weight="300" fill="#EEF4FF">Cloudflare</text><text class="lm-sans" y="24" font-size="12.5" fill="#A5B1C4">Workers + R2 storage</text></g>
      <g class="lm-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="54" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="lm-mono" x="83" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">React</text></g><g class="lm-chip" style="animation-delay:1.12s"><rect x="118" y="314" width="91" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="lm-mono" x="164" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">TypeScript</text></g><g class="lm-chip" style="animation-delay:1.24s"><rect x="217" y="314" width="76" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="lm-mono" x="255" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">Firebase</text></g><g class="lm-chip" style="animation-delay:1.36s"><rect x="301" y="314" width="84" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="lm-mono" x="343" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">Firestore</text></g><g class="lm-chip" style="animation-delay:1.48s"><rect x="393" y="314" width="113" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="lm-mono" x="450" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">Cloudflare R2</text></g>
    </g>
    <g class="lm-in lm-d2"><g transform="translate(0 35)">
      <g transform="translate(860 30)">
        <g transform="translate(0 200)">
          <animateTransform attributeName="transform" type="translate" values="0 200; 0 200; 0 200" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#163A7A" fill-opacity=".92" stroke="#BCD8FF" stroke-opacity=".7" stroke-dasharray="5 4"/>
          <text class="lm-mono" x="96" y="-17" font-size="10.5" fill="#EEF4FF" transform="skewX(-38) translate(14 0)">Cloudflare R2</text>
        </g>
        <g transform="translate(0 158)">
          <animateTransform attributeName="transform" type="translate" values="0 158; 0 152; 0 158" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#111C33" fill-opacity=".92" stroke="#6AA6FF" stroke-opacity=".45" />
          <text class="lm-mono" x="96" y="-17" font-size="10.5" fill="#EEF4FF" transform="skewX(-38) translate(14 0)">Firestore</text>
        </g>
        <g transform="translate(0 116)">
          <animateTransform attributeName="transform" type="translate" values="0 116; 0 104; 0 116" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#111C33" fill-opacity=".92" stroke="#6AA6FF" stroke-opacity=".45" />
          <text class="lm-mono" x="96" y="-17" font-size="10.5" fill="#EEF4FF" transform="skewX(-38) translate(14 0)">Firebase Auth</text>
        </g>
        <g transform="translate(0 74)">
          <animateTransform attributeName="transform" type="translate" values="0 74; 0 56; 0 74" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#111C33" fill-opacity=".92" stroke="#6AA6FF" stroke-opacity=".45" />
          <text class="lm-mono" x="96" y="-17" font-size="10.5" fill="#EEF4FF" transform="skewX(-38) translate(14 0)">React UI</text>
        </g>
      </g>
      <text class="lm-mono" x="1176" y="270" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#A5B1C4">REACT · FIREBASE · CLOUDFLARE WORKERS + R2</text>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#6AA6FF" stroke-opacity=".2"/>
    <rect class="lm-trace" style="animation-delay:-2.8s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#lm-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
