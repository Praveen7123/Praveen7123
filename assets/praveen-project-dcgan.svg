<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="dg-t">
  <title id="dg-t">Synthetic Face Generation with DCGAN, with invisible watermarking.</title>
  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <radialGradient id="dg-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".7"/><stop offset="1" stop-color="#163A7A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dg-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6AA6FF" stroke-opacity=".07"/>
    </pattern>
    <filter id="dg-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dg-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="dg-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4FF"/><stop offset=".45" stop-color="#BCD8FF"/><stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dg-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .dg-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .dg-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dg-in { animation: dg-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .dg-d1 { animation-delay: .15s; } .dg-d2 { animation-delay: .4s; }
    .dg-chip { animation: dg-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes dg-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .dg-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: dg-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes dg-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes dg-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .dg-in, .dg-chip { animation: none; } .dg-draw { animation: none; stroke-dashoffset: 0; } }
    .dg-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: dg-trace 7s linear infinite; }
    @keyframes dg-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .dg-trace { display: none; } }
  </style>
  <g clip-path="url(#dg-clip)">
    <rect width="1200" height="370" fill="url(#dg-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#dg-grid)"/>
    <rect width="1200" height="370" fill="url(#dg-glow)"/>
    <g class="dg-in dg-d1">
      <text class="dg-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#6AA6FF">02 · GENERATIVE AI · COMPUTER VISION</text>
      <text class="dg-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#EEF4FF">Synthetic Faces<tspan class="dg-serif" font-size="22" font-style="italic" fill="#BCD8FF" dx="14">with DCGAN</tspan></text>
      <text class="dg-sans" x="56" y="166" font-size="17" fill="#A5B1C4">Synthetic faces with invisible watermarks for AI-content traceability.</text>
      <text class="dg-mono" x="56" y="200" font-size="12.5" fill="#BCD8FF"><tspan fill="#6AA6FF">BUILT ›</tspan> DCGAN trained on 200K+ CelebA images + invisible watermarking</text>
      <line class="dg-draw" x1="56" y1="226" x2="680" y2="226" stroke="#6AA6FF" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="dg-serif" font-size="34" font-weight="300" fill="#EEF4FF">200K+</text><text class="dg-sans" y="24" font-size="12.5" fill="#A5B1C4">CelebA training images</text></g>
    <g transform="translate(261 266)"><text class="dg-serif" font-size="34" font-weight="300" fill="#EEF4FF">18.4</text><text class="dg-sans" y="24" font-size="12.5" fill="#A5B1C4">FID score</text></g>
    <g transform="translate(466 266)"><text class="dg-serif" font-size="34" font-weight="300" fill="#EEF4FF">95.8%</text><text class="dg-sans" y="24" font-size="12.5" fill="#A5B1C4">watermark detection · 10K test</text></g>
      <g class="dg-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="69" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="dg-mono" x="90" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">PyTorch</text></g><g class="dg-chip" style="animation-delay:1.12s"><rect x="133" y="314" width="54" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="dg-mono" x="160" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">DCGAN</text></g><g class="dg-chip" style="animation-delay:1.24s"><rect x="195" y="314" width="47" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="dg-mono" x="218" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">GANs</text></g><g class="dg-chip" style="animation-delay:1.36s"><rect x="250" y="314" width="61" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="dg-mono" x="280" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">CelebA</text></g><g class="dg-chip" style="animation-delay:1.48s"><rect x="319" y="314" width="106" height="26" rx="13" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".35"/><text class="dg-mono" x="372" y="331" text-anchor="middle" font-size="11.5" fill="#BCD8FF">Watermarking</text></g>
    </g>
    <g class="dg-in dg-d2"><g transform="translate(0 35)">
      <g transform="translate(870 46)">
        <rect x="-40" y="22" width="150" height="196" rx="10" fill="#111C33" stroke="#6AA6FF" stroke-opacity=".2" transform="rotate(-9 35 120)"/>
        <rect x="-10" y="14" width="150" height="196" rx="10" fill="#14213D" stroke="#6AA6FF" stroke-opacity=".28" transform="rotate(-3 65 112)"/>
        <g transform="rotate(4 120 110)">
          <rect x="44" y="8" width="150" height="200" rx="10" fill="#172A4D" stroke="#6AA6FF" stroke-opacity=".45"/>
          <g fill="#EEF4FF" fill-opacity=".16">
            <ellipse cx="119" cy="84" rx="30" ry="36"/>
            <path d="M64 196 C 68 150, 96 134, 119 134 S 170 150, 174 196 Z"/>
          </g>
          <ellipse cx="119" cy="84" rx="30" ry="36" fill="none" stroke="#BCD8FF" stroke-opacity=".6" filter="url(#dg-glowf)"/>
          <rect x="150" y="178" width="30" height="16" rx="4" fill="none" stroke="#6AA6FF" stroke-dasharray="3 3"/>
          <rect x="46" y="10" width="146" height="40" fill="#BCD8FF" fill-opacity=".08">
            <animate attributeName="y" values="10;166;10" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          </rect>
        </g>
        <g transform="translate(120 170)">
          <rect width="196" height="54" rx="10" fill="#0A1120" fill-opacity=".92" stroke="#6AA6FF" stroke-opacity=".35"/>
          <text class="dg-mono" x="14" y="22" font-size="10.5" fill="#EEF4FF">G · noise z → new face</text>
          <text class="dg-mono" x="14" y="40" font-size="10.5" fill="#BCD8FF">W · watermark detected ✓</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#6AA6FF" stroke-opacity=".2"/>
    <rect class="dg-trace" style="animation-delay:-1.4s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#dg-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
