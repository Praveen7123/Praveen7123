<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ach-title ach-desc">
  <title id="ach-title">Experience and results</title>
  <desc id="ach-desc">AI/ML Engineering Intern at The Hindu Publications since June 2025: on-device LLM integration connecting Flutter with Kotlin and C++ through platform channels; resume-reported response time cut from 2.5 seconds to 1.1 seconds. SENTIMENT-X multimodal emotion AI: 92% accuracy and 60% lower latency. DCGAN face generation: 200K+ CelebA training images, FID 18.4, 95.8% watermark detection on a 10K-image test set. B.E. CSE (AI and ML), class of 2027. Two NPTEL certifications.</desc>

  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#060A14"/>
    </linearGradient>
    <radialGradient id="ach-glow-a" cx="85%" cy="0%" r="90%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#163A7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ach-glow-b" cx="90%" cy="0%" r="90%">
      <stop offset="0" stop-color="#6AA6FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#163A7A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ach-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset=".4" stop-color="#7DD3FC"/>
      <stop offset=".6" stop-color="#BCD8FF"/>
      <stop offset="1" stop-color="#BCD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-outline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BCD8FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#BCD8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF4FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#EEF4FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#EEF4FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ach-clip-a"><rect x="0" y="0" width="700" height="250" rx="16"/></clipPath>
    <clipPath id="ach-clip-b"><rect x="0" y="0" width="476" height="250" rx="16"/></clipPath>
    <linearGradient id="ach-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4FF"/><stop offset=".45" stop-color="#BCD8FF"/><stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ach-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ach-in { animation: ach-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .35s; } .a3 { animation-delay: .6s; }
    .ach-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ach-draw 2.6s cubic-bezier(.65,0,.35,1) .8s forwards; }
    @keyframes ach-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ach-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ach-in { animation: none; }
      .ach-draw { animation: none; stroke-dashoffset: 0; }
    }
    .ach-trace-a { stroke-dasharray: 340 1900; stroke-dashoffset: 2240; animation: ach-trace-a 6s linear infinite; }
    .ach-trace-b { stroke-dasharray: 260 1452; stroke-dashoffset: 1712; animation: ach-trace-b 6s linear -3s infinite; }
    @keyframes ach-trace-a { to { stroke-dashoffset: 0; } }
    @keyframes ach-trace-b { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ach-trace-a, .ach-trace-b { display: none; } }
  </style>

  <rect width="1200" height="430" rx="20" fill="url(#ach-bg)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#6AA6FF" stroke-opacity=".16"/>

  <!-- Internship — hero card -->
  <g class="ach-in a1"><g transform="translate(24 24)">
    <g clip-path="url(#ach-clip-a)">
      <rect width="700" height="250" fill="#0A1120"/>
      <rect width="700" height="250" fill="url(#ach-glow-a)"/>
      <text class="ach-serif" x="684" y="124" text-anchor="end" font-size="128" font-weight="300" letter-spacing="-6" fill="url(#ach-outline)">1.1s</text>
      <rect x="-300" y="0" width="260" height="250" fill="url(#ach-sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="-300;900;900" keyTimes="0;.35;1" dur="9s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="#6AA6FF" stroke-opacity=".38"/>
    <rect class="ach-trace-a" x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="40" y="0" width="300" height="1" fill="url(#ach-hair)"/>
    <text class="ach-mono" x="36" y="154" font-size="12" letter-spacing="2.6" fill="#6AA6FF">THE HINDU PUBLICATIONS · JUN 2025 – PRESENT</text>
    <text class="ach-serif" x="34" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#EEF4FF">AI/ML Engineering Intern</text>
    <text class="ach-sans" x="36" y="230" font-size="14" fill="#A5B1C4">On-device LLM · Flutter ↔ Kotlin/C++ · response 2.5 s → 1.1 s</text>
  </g></g>

  <!-- SENTIMENT-X -->
  <g class="ach-in a2"><g transform="translate(700 24)">
    <g transform="translate(24 0)">
      <g clip-path="url(#ach-clip-b)">
        <rect width="476" height="250" fill="#0A1120"/>
        <rect width="476" height="250" fill="url(#ach-glow-b)"/>
        <text class="ach-serif" x="490" y="132" text-anchor="end" font-size="160" font-style="italic" font-weight="300" letter-spacing="-6" fill="none" stroke="#BCD8FF" stroke-opacity=".3">92%</text>
      </g>
      <rect x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="#6AA6FF" stroke-opacity=".3"/>
      <rect class="ach-trace-b" x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="40" y="0" width="220" height="1" fill="url(#ach-hair)"/>
      <text class="ach-mono" x="32" y="154" font-size="12" letter-spacing="2.6" fill="#6AA6FF">SENTIMENT-X · MULTIMODAL AI</text>
      <text class="ach-serif" x="30" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#EEF4FF">92% Accuracy</text>
      <text class="ach-sans" x="32" y="230" font-size="14" fill="#A5B1C4">face · voice · text emotion AI · 60% lower latency</text>
    </g>
  </g></g>

  <!-- Animated connector across the score strip -->
  <path class="ach-draw" d="M24 300 H1176" stroke="#6AA6FF" stroke-opacity=".35"/>

  <!-- Score strip -->
  <g class="ach-in a3 ach-sans" font-size="13" fill="#A5B1C4">
    <g transform="translate(36 300)">
      <circle cx="0" cy="0" r="3.5" fill="#BCD8FF"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#6AA6FF">DCGAN</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#EEF4FF">200K+</text>
      <text y="102">CelebA training images</text>
    </g>
    <g transform="translate(266 300)">
      <circle cx="0" cy="0" r="3.5" fill="#BCD8FF"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#6AA6FF">FID SCORE</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#EEF4FF">18.4</text>
      <text y="102">synthetic face quality</text>
    </g>
    <g transform="translate(496 300)">
      <circle cx="0" cy="0" r="3.5" fill="#BCD8FF"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#6AA6FF">WATERMARK</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#EEF4FF">95.8%</text>
      <text y="102">detection · 10K-image test</text>
    </g>
    <g transform="translate(726 300)">
      <circle cx="0" cy="0" r="3.5" fill="#BCD8FF"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#6AA6FF">DEGREE</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#EEF4FF">2027</text>
      <text y="102">B.E. CSE (AI &amp; ML)</text>
    </g>
    <g transform="translate(956 300)">
      <circle cx="0" cy="0" r="3.5" fill="#BCD8FF"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#6AA6FF">NPTEL</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#EEF4FF">2</text>
      <text y="102">Deep Learning · Python</text>
    </g>
  </g>
</svg>
