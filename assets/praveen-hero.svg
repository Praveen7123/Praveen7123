<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Praveen K S — AI/ML Engineer</title>
  <desc id="desc">A burgundy and rose animated developer profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C77B9B" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="88" r="120" fill="none" stroke="#C77B9B" stroke-opacity=".25"/>
  <circle cx="1030" cy="88" r="82" fill="none" stroke="#E5B5C7" stroke-opacity=".25" stroke-dasharray="3 10">
    <animateTransform attributeName="transform" type="rotate" from="0 1030 88" to="360 1030 88" dur="48s" repeatCount="indefinite"/>
  </circle>
  <path d="M760 300 C850 210 880 340 980 220 S1110 190 1200 120" fill="none" stroke="#C77B9B" stroke-opacity=".5" stroke-width="2"/>
  <path d="M760 300 C850 210 880 340 980 220 S1110 190 1200 120" fill="none" stroke="url(#shine)" stroke-width="4" filter="url(#glow)" stroke-dasharray="120 600">
    <animate attributeName="stroke-dashoffset" from="720" to="0" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="76" y="78" fill="#C77B9B" font-family="monospace" font-size="15" letter-spacing="4">AI • MACHINE LEARNING • SOFTWARE</text>
  <text x="72" y="160" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">PRAVEEN K S</text>
  <rect x="76" y="184" width="290" height="3" rx="1.5" fill="#C77B9B">
    <animate attributeName="width" values="120;290;220;290" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="76" y="229" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="24">Aspiring AI/ML Engineer</text>
  <text x="76" y="266" fill="#F8F0F3" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="17">Learning by building. Exploring with curiosity.</text>
  <text x="76" y="319" fill="#C77B9B" font-family="monospace" font-size="13" letter-spacing="2">PYTHON  /  DEEP LEARNING  /  FULL-STACK</text>
  <circle cx="1100" cy="278" r="4" fill="#E5B5C7" filter="url(#glow)"/>
  <circle cx="1100" cy="278" r="15" fill="none" stroke="#C77B9B" stroke-opacity=".5">
    <animate attributeName="r" values="8;22;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".7;0;.7" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
