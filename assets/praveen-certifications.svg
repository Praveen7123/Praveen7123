<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Certifications</title>
  <desc id="ce-d">Deep Learning, NPTEL, IIT Ropar, July to October 2024. The Joy of Computing using Python, NPTEL, January to April 2024.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".5"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F0F3"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-tile { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge { stroke-dasharray: 1440; stroke-dashoffset: 1440; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 1440; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>
  <rect width="1200" height="250" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="250" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <g class="ce-tile" style="animation-delay:0.20s"><g transform="translate(40 40)">
    <rect width="550" height="170" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="550" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.00s"/>
    <text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">NPTEL · IIT ROPAR</text>
    <circle cx="523" cy="31" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="54" x2="528" y2="54" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-serif" x="22" y="92" font-size="26" fill="#F8F0F3">Deep Learning</text><text class="ce-sans" x="22" y="120" font-size="14" fill="#B6A3AC">CNNs · RNNs · Transformers, hands-on training pipelines</text><text class="ce-sans" x="22" y="146" font-size="14" fill="#E5B5C7">Jul – Oct 2024</text>
  </g></g>
  <g class="ce-tile" style="animation-delay:0.32s"><g transform="translate(610 40)">
    <rect width="550" height="170" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="550" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.35s"/>
    <text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">NPTEL</text>
    <circle cx="523" cy="31" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="54" x2="528" y2="54" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-serif" x="22" y="92" font-size="26" fill="#F8F0F3">The Joy of Computing using Python</text><text class="ce-sans" x="22" y="120" font-size="14" fill="#B6A3AC">Python fundamentals and project-driven applications</text><text class="ce-sans" x="22" y="146" font-size="14" fill="#E5B5C7">Jan – Apr 2024</text>
  </g></g>
</svg>
